input {
  beats {
    host => "127.0.0.1"
    port => 5045
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    add_field => { "logstash_pipeline" => "suricata_pipeline" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch.local:9200"]
    index => "active-suricata"
    data_stream => false
    ilm_enabled => false
    manage_template => false
  }
}
