---
- name: Verify Docker Engine is already installed
  ansible.builtin.command:
    argv:
      - docker
      - version
  changed_when: false
  become: true

- name: Verify the Docker Compose plugin is already installed
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  changed_when: false
  become: true

- name: Add the Mini Manticore host aliases
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR MINI MANTICORE"
    state: present
    block: |
      {{ mini_manticore_loopback_address }} {{ mini_manticore_host_aliases | join(' ') }}
  become: true

- name: Configure the Elasticsearch virtual-memory map limit
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "1048576"
    state: present
    sysctl_set: true
    reload: true
  become: true

- name: Ensure the Mini Manticore project root exists
  ansible.builtin.file:
    path: "{{ docker_path }}"
    state: directory
    mode: "0750"
    owner: root
    group: docker
  become: true
